name: Fix LeetSync Commit Messages
on:
  push:
    branches: [main]

jobs:
  reword:
    if: github.event.head_commit.author.email == 'leetsync-bot@example.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reword last commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          OLD_MSG=$(git log -1 --pretty=%B)
          NEW_MSG=$(echo "$OLD_MSG" | sed -E 's/synced (.+)/Solve: \1/')
          git commit --amend -m "$NEW_MSG"
          git push --force
