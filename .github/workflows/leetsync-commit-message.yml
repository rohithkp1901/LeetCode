name: Format LeetSync Commit Messages

on:
  push:
    branches: [main]

jobs:
  reword:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reformat commit message
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          FIRST_LINE=$(git log -1 --pretty=%B | head -n1)

          if [[ $FIRST_LINE =~ ^([0-9]+)-(.+)$ ]]; then
            NUM="${BASH_REMATCH[1]}"
            SLUG="${BASH_REMATCH[2]}"

            TITLE=$(echo "$SLUG" | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)} 1')

            NEW_MSG="#${NUM} - ${TITLE} | LeetCode"
            git commit --amend -m "$NEW_MSG"
            git push --force
          else
            echo "Pattern not matched, leaving message as is: $FIRST_LINE"
          fi
